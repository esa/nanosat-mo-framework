      - name: Cache Maven local repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-mo-services-java-jdk25-${{ steps.get-date.outputs.date }}

  testbed-area-mc-jdk11:
    runs-on: ubuntu-latest
    needs: build-jdk11
    steps:
      - name: Get Date
        id: get-date
        run: |
          echo "date=$(/bin/date -u "+%Y-week-%U")" >> $GITHUB_OUTPUT
        shell: bash
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Restore Maven local repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-mo-services-java-jdk11-${{ steps.get-date.outputs.date }}
      - name: Install NMF framework
        run: mvn --batch-mode -DskipTests install
      - name: Run MC Area testbed
        run: mvn --batch-mode test -f testbeds/testbed-area-mc/pom.xml

