    runs-on: ubuntu-latest
    needs: build-jdk11
    steps:
      - name: Get Date
        id: get-date
        run: |
          echo "timestamp=$(/bin/date -u "+%Y-%m-%dT%H-%M-%SZ")" >> $GITHUB_OUTPUT
        shell: bash
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
