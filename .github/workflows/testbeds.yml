      - name: Install NMF framework
        run: mvn --batch-mode -DskipTests install
      - name: Run performance testbed
        run: mvn --batch-mode test -f testbeds/testbed-performance/pom.xml
      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-performance-results-jdk11-${{ steps.get-date.outputs.timestamp }}
          path: |
            testbeds/testbed-performance/target/performance-results.txt
            testbeds/testbed-performance/target/tier-*.log

