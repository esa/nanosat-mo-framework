name: NMF
on: [push]
permissions:
  contents: read
jobs:
  build-jdk21:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Maven local repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-mo-services-java-jdk21-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-mo-services-java-jdk21-
      - name: Set up the App sandboxes (AppSandboxSecretsTest)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts the unprivileged user namespaces that bubblewrap uses
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          docker pull eclipse-temurin:21-jre
      - name: Run Maven install
        run: mvn --batch-mode --update-snapshots install -Desa.mo.nmf.test.requireSandboxes=true

  build-jdk25:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Cache Maven local repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-mo-services-java-jdk25-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-mo-services-java-jdk25-
      - name: Set up the App sandboxes (AppSandboxSecretsTest)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts the unprivileged user namespaces that bubblewrap uses
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          docker pull eclipse-temurin:21-jre
      - name: Run Maven install
        run: mvn --batch-mode --update-snapshots install -Desa.mo.nmf.test.requireSandboxes=true
  testbed-area-mc-jdk21:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-jdk21
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Restore Maven local repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-mo-services-java-jdk21-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-mo-services-java-jdk21-
      - name: Install NMF framework
        run: mvn --batch-mode -DskipTests install
      - name: Run MC Area testbed
        run: mvn --batch-mode test -f testbeds/testbed-area-mc/pom.xml

  testbed-area-mc-jdk25:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-jdk25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Restore Maven local repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-mo-services-java-jdk25-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-mo-services-java-jdk25-
      - name: Install NMF framework
        run: mvn --batch-mode -DskipTests install
      - name: Run MC Area testbed
        run: mvn --batch-mode test -f testbeds/testbed-area-mc/pom.xml
  testbed-area-com-jdk21:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-jdk21
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Restore Maven local repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-mo-services-java-jdk21-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-mo-services-java-jdk21-
      - name: Install NMF framework
        run: mvn --batch-mode -DskipTests install
      - name: Run COM Area testbed
        run: mvn --batch-mode test -f testbeds/testbed-area-com/pom.xml

  testbed-area-com-jdk25:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-jdk25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Restore Maven local repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-mo-services-java-jdk25-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-mo-services-java-jdk25-
      - name: Install NMF framework
        run: mvn --batch-mode -DskipTests install
      - name: Run COM Area testbed
        run: mvn --batch-mode test -f testbeds/testbed-area-com/pom.xml
  testbed-e2e-jdk21:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-jdk21
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Restore Maven local repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-mo-services-java-jdk21-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-mo-services-java-jdk21-
      - name: Install NMF framework
        run: mvn --batch-mode -DskipTests install
      - name: Run E2E testbed
        run: |
          mvn --batch-mode -DskipTests install -f testbeds/pom.xml -pl broken-app-for-testbeds
          mvn --batch-mode test -f testbeds/testbed-e2e/pom.xml

  testbed-e2e-jdk25:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-jdk25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Restore Maven local repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-mo-services-java-jdk25-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-mo-services-java-jdk25-
      - name: Install NMF framework
        run: mvn --batch-mode -DskipTests install
      - name: Run E2E testbed
        run: |
          mvn --batch-mode -DskipTests install -f testbeds/pom.xml -pl broken-app-for-testbeds
          mvn --batch-mode test -f testbeds/testbed-e2e/pom.xml
  testbed-performance-jdk21:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-jdk21
    steps:
      - name: Get Date
        id: get-date
        run: |
          echo "timestamp=$(/bin/date -u "+%Y-%m-%dT%H-%M-%SZ")" >> $GITHUB_OUTPUT
        shell: bash
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Restore Maven local repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-mo-services-java-jdk21-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-mo-services-java-jdk21-
      - name: Install NMF framework
        run: mvn --batch-mode -DskipTests install
      - name: Run performance testbed
        run: mvn --batch-mode test -f testbeds/testbed-performance/pom.xml
      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cli-performance-results-jdk21-${{ steps.get-date.outputs.timestamp }}
          path: |
            testbeds/testbed-performance/target/performance-results.txt
            testbeds/testbed-performance/target/tier-*.log

  testbed-performance-jdk25:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-jdk25
    steps:
      - name: Get Date
        id: get-date
        run: |
          echo "timestamp=$(/bin/date -u "+%Y-%m-%dT%H-%M-%SZ")" >> $GITHUB_OUTPUT
        shell: bash
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Restore Maven local repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-mo-services-java-jdk25-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-mo-services-java-jdk25-
      - name: Install NMF framework
        run: mvn --batch-mode -DskipTests install
      - name: Run performance testbed
        run: mvn --batch-mode test -f testbeds/testbed-performance/pom.xml
      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cli-performance-results-jdk25-${{ steps.get-date.outputs.timestamp }}
          path: |
            testbeds/testbed-performance/target/performance-results.txt
            testbeds/testbed-performance/target/tier-*.log
