name: NMF Security

on: [push]

permissions:
  contents: read

jobs:
  security-toolkit-jdk21:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Maven local repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-security-jdk21-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-security-jdk21-
      - name: Build the framework
        run: mvn --batch-mode --update-snapshots -DskipTests install
      - name: Build the simulator fat jar (NMF-2026-001)
        run: >-
          mvn --batch-mode -DskipTests -Passembly-with-dependencies
          -pl nmf-mission-simulator-orekit/cubesat-spacecraft-simulator install
      - name: Build the cli-tool fat jar (NMF-2026-003)
        run: >-
          mvn --batch-mode -DskipTests -Passembly-with-dependencies -pl sdk/cli-tool install
      - name: Build the probe app packages (NMF-2026-003, access control)
        run: >-
          mvn --batch-mode -DskipTests -f security-toolkit/pom.xml
          -pl app-privilege-probe,app-permissions-probe package
      - name: Generate the barebone filesystem with linux-userspace (NMF-2026-003, NMF-2026-007)
        run: >-
          mvn --batch-mode -DskipTests -pl nmf-mission-barebone/barebone-space-filesystem package
          -Pgenerate-filesystem -Dgenerate-filesystem.appsIsolation=linux-userspace
      - name: Run the security toolkit
        run: mvn --batch-mode test -f security-toolkit/pom.xml
