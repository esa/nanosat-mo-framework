<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420"
       font-family="Arial, sans-serif" font-size="13">
    <defs>
      <marker id="arr" markerWidth="8" markerHeight="6"
              refX="8" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#555"/>
      </marker>
      <marker id="arr-d" markerWidth="8" markerHeight="6"
              refX="8" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#888"/>
      </marker>
    </defs>

    <!-- ── Spacecraft box ───────────────────────────────────────── -->
    <rect x="10" y="25" width="700" height="240"
          rx="8" fill="#eef3fb" stroke="#6b8fc2" stroke-width="1.5"/>
    <text x="360" y="45" text-anchor="middle"
          font-weight="bold" fill="#4a70a8">Spacecraft</text>

    <!-- App A node -->
    <rect x="60" y="55" width="155" height="40"
          rx="4" fill="#fff" stroke="#aac" stroke-width="1"/>
    <text x="137" y="80" text-anchor="middle" fill="#333">App A</text>

    <!-- Supervisor box (centre) -->
    <rect x="258" y="115" width="204" height="125"
          rx="6" fill="#dce8f8" stroke="#8aadd6" stroke-width="1"/>
    <text x="360" y="134" text-anchor="middle"
          font-weight="bold" fill="#4a70a8">Supervisor</text>

    <!-- Platform services node -->
    <rect x="276" y="148" width="168" height="40"
          rx="4" fill="#fff" stroke="#aac" stroke-width="1"/>
    <text x="360" y="173" text-anchor="middle" fill="#333">Platform services</text>

    <!-- App B node -->
    <rect x="505" y="55" width="155" height="40"
          rx="4" fill="#fff" stroke="#aac" stroke-width="1"/>
    <text x="582" y="80" text-anchor="middle" fill="#333">App B</text>

    <!-- spawns: Supervisor → App A -->
    <line x1="258" y1="165" x2="215" y2="75"
          stroke="#888" stroke-width="1.2" stroke-dasharray="5,3"
          marker-end="url(#arr-d)"/>
    <text x="228" y="120" text-anchor="middle"
          font-size="11" fill="#888" font-style="italic">spawns</text>

    <!-- spawns: Supervisor → App B -->
    <line x1="462" y1="165" x2="505" y2="75"
          stroke="#888" stroke-width="1.2" stroke-dasharray="5,3"
          marker-end="url(#arr-d)"/>
    <text x="492" y="120" text-anchor="middle"
          font-size="11" fill="#888" font-style="italic">spawns</text>

    <!-- ── Ground segment box ───────────────────────────────────── -->
    <rect x="10" y="293" width="700" height="95"
          rx="8" fill="#edfaed" stroke="#6bb86b" stroke-width="1.5"/>
    <text x="360" y="313" text-anchor="middle"
          font-weight="bold" fill="#3d8c3d">Ground segment</text>

    <!-- Consumer node -->
    <rect x="220" y="323" width="280" height="40"
          rx="4" fill="#fff" stroke="#aac" stroke-width="1"/>
    <text x="360" y="348" text-anchor="middle" fill="#333">Consumer / CTT / Ground app</text>

    <!-- ── connects to arrows ───────────────────────────────────── -->
    <!-- → App A -->
    <line x1="290" y1="323" x2="137" y2="95"
          stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
    <!-- → Supervisor (vertical) -->
    <line x1="360" y1="323" x2="360" y2="240"
          stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="378" y="285" font-size="11" fill="#555" font-style="italic">connects to</text>
    <!-- → App B -->
    <line x1="430" y1="323" x2="582" y2="95"
          stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  </svg>