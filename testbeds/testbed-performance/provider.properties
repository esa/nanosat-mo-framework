# Transport file path
helpertools.configurations.provider.transportfilepath=transport.properties

# Network zone
helpertools.configurations.NetworkZone=NMF
helpertools.configurations.MissionName=Testbed
helpertools.configurations.DeviceName=Machine

# MAL factory class
org.ccsds.moims.mo.mal.factory.class=esa.mo.mal.impl.MALContextFactoryImpl

# Supervisor identity (used when this file is loaded by the supervisor JVM)
helpertools.configurations.MOappName=nanosat-mo-supervisor
helpertools.configurations.OrganizationName=esa

# Apps folder location relative to the supervisor working directory
esa.mo.sm.impl.provider.appslauncher.FolderLocation=apps
