# The Directory service that answers for a whole constellation.
#
# It is a provider: consumers connect to it to find the spacecraft. What it
# publishes are the addresses the spacecraft themselves gave, so nothing of the
# traffic passes through here.

helpertools.configurations.provider.transportfilepath=transport.properties
org.ccsds.moims.mo.mal.factory.class=esa.mo.mal.impl.MALContextFactoryImpl

helpertools.configurations.MOappName=constellation-directory
helpertools.configurations.OrganizationName=esa
helpertools.configurations.MissionName=constellation
helpertools.configurations.NetworkZone=Ground
helpertools.configurations.DeviceName=Workstation
